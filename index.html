<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen">
  <title>Todo App</title>
</head>
<body class="page">
  <header class="header">
    <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="todo">
    <h1 class="todo__main-heading">Todo</h1>
    <section class="todo__new-task">
      <h3 class="todo__heading">Add Item</h3>
      <div class="todo__new-task-form">
        <input class="todo__new-task-input-text input-text" id="new-task" type="text">
        <button class="todo__btn-add btn">Add</button>
      </div>
    </section>
    <section class="todo__task">
      <h3 class="todo__heading">Todo</h3>
      <ul class="todo__task-list" id="in-complete-tasks">
        <li class="todo__task-item">
          <input class="todo__input-checkbox" type="checkbox">
          <label class="todo__task-name">Pay Bills</label>
          <input class="todo__task-input-text input-text" type="text">
          <button class="todo__btn-edit btn">Edit</button>
          <button class="todo__btn-remove btn">
            <img class="todo__btn-remove-img" src="./remove.svg" alt="remove">
          </button>
        </li>
        <li class="todo__task-item todo__task-item--edit">
          <input class="todo__input-checkbox" type="checkbox">
          <label class="todo__task-name">Go Shopping</label>
          <input class="todo__task-input-text input-text" type="text" value="Go Shopping">
          <button class="todo__btn-edit btn">Save</button>
          <button class="todo__btn-remove btn">
            <img class="todo__btn-remove-img" src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
    <section class="todo__task">
      <h3 class="todo__heading">Completed</h3>
      <ul class="todo__task-list todo__task-list--completed" id="completed-tasks">
        <li class="todo__task-item">
          <input class="todo__input-checkbox" type="checkbox" checked>
          <label class="todo__task-name">See the Doctor</label>
          <input class="todo__task-input-text input-text" type="text">
          <button class="todo__btn-edit btn">Edit</button>
          <button class="todo__btn-remove btn">
            <img class="todo__btn-remove-img" src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
