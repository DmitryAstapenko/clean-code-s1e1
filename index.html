<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen">
  <title>Todo App</title>
</head>
<body class="container">
  <div class="header">
    <img class="header-img" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
    <a class="details-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>
  <div class="todo">
    <p id="todo-add-item">
      <label class="heading heading-add-item" for="new-task">Add Item</label>
      <div class="task-row-wrapper">
        <input id="new-task" class="input-text task" type="text">
        <button class="btn">Add</button>
      </div>
    </p>
    <h3 class="heading">Todo</h3>
    <ul class="todo-tasks-list" id="in-complete-tasks">
      <li class="todo-task">
        <input class="task-element input-checkbox" type="checkbox">
        <label class="task-element task-name task">Pay Bills</label>
        <input type="text" class="task-element input-text task">
        <button class="task-element btn edit">Edit</button>
        <button class="task-element btn delete">
          <img class="img-remove" src="./remove.svg" alt="remove">
        </button>
      </li>
      <li class="todo-task edit-mode">
        <input class="task-element input-checkbox" type="checkbox">
        <label class="task-element task-name task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task-element input-text task">
        <button class="task-element btn edit">Save</button>
        <button class="task-element btn delete">
          <img class="img-remove" src="./remove.svg" alt="remove">
        </button>
      </li>
    </ul>
    <h3 class="heading">Completed</h3>
    <ul class="todo-tasks-list" id="completed-tasks">
      <li class="todo-task">
        <input class="task-element input-checkbox" type="checkbox" checked>
        <label class="task-element task-name task">See the Doctor</label>
        <input type="text" class="task-element input-text task">
        <button class="task-element btn edit">Edit</button>
        <button class="task-element btn delete">
          <img class="img-remove" src="./remove.svg" alt="remove">
        </button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
